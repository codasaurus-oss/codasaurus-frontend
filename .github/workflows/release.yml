name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dist:
    name: Build dashboard bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package dist
        run: tar -czf dashboard-dist.tar.gz -C dist .
      - uses: softprops/action-gh-release@v3
        with:
          files: dashboard-dist.tar.gz
          generate_release_notes: true
